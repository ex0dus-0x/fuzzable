[project]
name = "fuzzable"
version = "2.1.0"
description = "Fuzz Target Discovery and Harnesser Tool"
authors = [
    { name = "ex0dus", email = "ex0dus@codemuch.tech" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "fuzzing", "vulnerability-research", "binary-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0.0",
    "miasm>=0.1.5",
    "rich>=14.2.0",
]

[project.urls]
Homepage = "https://codemuch.tech/fuzzable"
Repository = "https://github.com/ex0dus-0x/fuzzable"
Documentation = "https://github.com/ex0dus-0x/fuzzable/wiki"

[project.scripts]
fuzzable = "fuzzable.__main__:app"

[dependency-groups]
dev = [
    "githubrelease>=1.5.9",
    "gitpython>=3.1.45",
    "mypy>=1.18.2",
    "pydantic>=2.12.4",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuzzable"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, flake8-bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.mypy]
python_version = "3.10"
files = ["fuzzable"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
